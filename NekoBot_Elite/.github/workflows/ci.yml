name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile (catches syntax errors)
        run: python -m compileall -q bot dashboard tests

      - name: Lint (undefined names, unused imports, syntax)
        run: ruff check bot dashboard tests scripts --select=F,E9

      - name: Test
        env:
          BOT_TOKEN: "123456:ci-placeholder-token"
          OWNER_ID: "123456"
          DATABASE_URL: "sqlite+aiosqlite:///./data/ci_test.db"
        run: |
          mkdir -p data
          python -m pytest tests/ -q
