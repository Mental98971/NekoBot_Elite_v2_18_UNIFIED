# NOTE: the original nova_guard_bot's docker-compose.yml also defined a
# `dashboard` service built from `dashboard/Dockerfile` — that directory
# wasn't present anywhere in the uploaded project, so `docker-compose up`
# would have failed on a missing build context. It's a real, working
# read-only service now (see dashboard/main.py), added back above.
